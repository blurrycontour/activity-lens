apply plugin: 'com.android.application'

// HAND-EDITED. See mobile/README.md for the full list of changes to the
// generated Android project.
//
// Version and signing come from outside the file so nothing has to be edited to
// cut a release, and no secret is ever committed:
//
//   ./gradlew assembleRelease -PalVersionName=1.4.0 -PalVersionCode=14
//
// Both have defaults, so a plain `assembleDebug` works with no arguments.
def alVersionName = project.findProperty('alVersionName') ?: '0.0.0-dev'
def alVersionCode = (project.findProperty('alVersionCode') ?: '1') as Integer

// Release signing is configured only when a keystore is actually supplied.
// Without one, `assembleRelease` still produces an unsigned APK rather than
// failing — that is the useful behaviour for anyone building their own copy,
// and CI supplies the keystore through these same properties.
def keystorePath = project.findProperty('alKeystore')
def hasKeystore = keystorePath != null && file(keystorePath).exists()
// PKCS#12 is the standard, interoperable keystore format and what keytool has
// produced by default since JDK 9; JKS is Sun's proprietary predecessor and is
// deprecated. Derived from the extension so an existing .jks keeps working, and
// overridable with -PalKeystoreType for anything unusual.
def keystoreType = project.findProperty('alKeystoreType')
    ?: (keystorePath?.toString()?.toLowerCase()?.endsWith('.jks') ? 'JKS' : 'PKCS12')

android {
    namespace = "io.blurrycontour.activitylens"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.blurrycontour.activitylens"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode alVersionCode
        versionName alVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystorePath)
                storeType keystoreType
                storePassword project.findProperty('alKeystorePassword')
                keyAlias project.findProperty('alKeyAlias')
                keyPassword project.findProperty('alKeyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Declared in both build types rather than in strings.xml, because a
            // resValue and a resource of the same name collide.
            resValue "string", "app_name", "Activity Lens"
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // A debug build is a *different app* to Android: its own package
            // name, its own icon, its own data.
            //
            // Without this a local build and the one the server hands out are the
            // same installed app, so testing a change means replacing the copy
            // you actually use — and the two cannot coexist to be compared. The
            // suffix costs nothing and makes "install my build alongside the real
            // one" the default.
            //
            // Everything derived from the application id follows automatically,
            // including the FileProvider authority. The label is set here for the
            // same reason: two identical "Activity Lens" icons in the launcher
            // would be worse than one.
            applicationIdSuffix '.dev'
            resValue "string", "app_name", "Activity Lens Dev"

            // Debug builds use the supplied keystore too, when there is one.
            //
            // Android refuses to replace an app with one signed by a different
            // key, and the default debug key is generated per machine and per
            // container — so two debug APKs from different places cannot update
            // each other, and a debug build can never update to a release. That
            // makes the in-app updater untestable without this.
            //
            // With a keystore configured in .env.build, every APK from this
            // repository shares one identity and updates work end to end.
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Auto-import: WorkManager runs the folder scan on a schedule with the app
    // closed, and DocumentFile is how a Storage Access Framework tree is read.
    implementation "androidx.work:work-runtime:$androidxWorkVersion"
    implementation "androidx.documentfile:documentfile:$androidxDocumentFileVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
