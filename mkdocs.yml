site_name: Activity Lens
site_description: Self-hosted training history — import, analyse, plan and share.
site_url: https://blurrycontour.github.io/activity-lens/
repo_url: https://github.com/blurrycontour/activity-lens
repo_name: blurrycontour/activity-lens
edit_uri: edit/main/docs/

docs_dir: docs

# One nav, listed once. Fifteen pages do not need a plugin to order themselves,
# and an explicit list is the only thing that makes a missing page obvious.
nav:
  - Home: index.md
  - Using it:
      - Getting started: user/getting-started.md
      - Workouts: user/workouts.md
      - Training plans: user/training-plans.md
      - Insights: user/insights.md
      - Sharing and people: user/sharing.md
  - Running it:
      - Deployment: admin/deployment.md
      - Configuration: admin/configuration.md
  - Building it:
      - Local setup: dev/setup.md
      - Architecture: dev/architecture.md
      - UI design: dev/ui-design.md
      - Android app: dev/android.md
      - Browser checks: dev/visual-verification.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      toggle: { icon: material/brightness-auto, name: Follow system }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

# Every internal link is checked on build, and CI builds with --strict, so a
# renamed page fails the docs job rather than rotting quietly.
validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/blurrycontour/activity-lens
