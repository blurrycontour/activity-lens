services:
  activity-lens:
    restart: unless-stopped
    image: activity-lens:latest
    container_name: activity-lens
    build:
      # Self-contained: go-authkit is pulled from the Go module proxy, so the
      # build needs only this directory and works the same locally and in CI.
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    # Run as the host user that owns ./.data so the bind mount is writable.
    user: "1000:1000"
    environment:
      AL_DATA_DIR: "/data"
      # Bootstrap admin, created on first run if it does not exist.
      AL_ADMIN_USER: "${AL_ADMIN_USER:-admin}"
      AL_ADMIN_EMAIL: "${AL_ADMIN_EMAIL:-admin@example.com}"
      AL_ADMIN_PASS: "${AL_ADMIN_PASS:-changeme}"
      # Set to true when serving over HTTPS (behind a TLS-terminating proxy).
      AL_SECURE_COOKIES: "${AL_SECURE_COOKIES:-true}"
      AL_ALLOW_REGISTRATION: "${AL_ALLOW_REGISTRATION:-false}"
      # OIDC / SSO. Any value set here overrides the same setting made via the
      # Admin GUI.
      AL_OIDC_ENABLED: "${AL_OIDC_ENABLED:-}"
      AL_OIDC_ISSUER_URL: "${AL_OIDC_ISSUER_URL:-}"
      AL_OIDC_CLIENT_ID: "${AL_OIDC_CLIENT_ID:-}"
      AL_OIDC_CLIENT_SECRET: "${AL_OIDC_CLIENT_SECRET:-}"
      AL_OIDC_REDIRECT_URL: "${AL_OIDC_REDIRECT_URL:-}"
      AL_OIDC_ADMIN_GROUP: "${AL_OIDC_ADMIN_GROUP:-}"
      AL_OIDC_PROVIDER_NAME: "${AL_OIDC_PROVIDER_NAME:-}"
      AL_OIDC_ALLOW_REGISTRATION: "${AL_OIDC_ALLOW_REGISTRATION:-}"
      AL_OIDC_SCOPES: "${AL_OIDC_SCOPES:-}"
      # SMTP (transactional email). Any value set here overrides the same
      # setting made via the Admin GUI.
      AL_SMTP_HOST: "${AL_SMTP_HOST:-}"
      AL_SMTP_PORT: "${AL_SMTP_PORT:-}"
      AL_SMTP_USERNAME: "${AL_SMTP_USERNAME:-}"
      AL_SMTP_PASSWORD: "${AL_SMTP_PASSWORD:-}"
      AL_SMTP_FROM: "${AL_SMTP_FROM:-}"
      AL_SMTP_FROM_NAME: "${AL_SMTP_FROM_NAME:-}"
      AL_SMTP_ENCRYPTION: "${AL_SMTP_ENCRYPTION:-}"
      # push notifications
      AL_PUSH_SUBJECT: "${AL_PUSH_SUBJECT:-}"
    volumes:
      - ./.data:/data
    ports:
      - 9090:8080
