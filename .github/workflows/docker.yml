name: Docker

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The APK the image will carry. Built once, here, and consumed by both the
  # image below and the release job — so "the same signed APK is in the image and
  # in the release" is true by construction, and checked besides.
  apk:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  build:
    name: Build and push image
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so `git describe` can resolve the nearest tag
          # and commit distance for untagged (main) builds.
          fetch-depth: 0

      # Bake a meaningful version into the binary: the exact semver on tag
      # builds (e.g. 1.2.3), or a `git describe` identifier on untagged main
      # builds (e.g. 1.0.1-5-ga1b2c3d) so each commit's image is distinct.
      - name: Compute app version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      # Dropped into the build context, where the Dockerfile's androidapp stage
      # copies it into the image.
      - name: Fetch the APK
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.apk.outputs.artifact }}
          path: mobile/dist

      # The image must not be built around a different APK than the one the
      # release publishes. Comparing the checksum the build job recorded is what
      # turns that from an assumption into a fact.
      - name: Verify the APK is the one that was built
        run: |
          actual="$(sha256sum mobile/dist/*.apk | cut -d' ' -f1)"
          expected="${{ needs.apk.outputs.sha256 }}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK checksum mismatch: got $actual, expected $expected"
            exit 1
          fi
          echo "Bundling $(jq -r .file mobile/dist/apk.json) ($expected)"

      # The same web bundle the APK ships, rather than a second build of it. The
      # Dockerfile's frontend-dist stage is overridden with this directory below,
      # so stage 2 does not run at all — which also takes a full pnpm install and
      # vite build off the image build's critical path.
      - name: Fetch the web bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.apk.outputs.web-artifact }}
          path: frontend/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only authenticate when we are going to push (never on pull requests).
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=sha,event=push
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          # Push on main and tag builds; build-only validation on pull requests.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Replaces the Dockerfile's frontend-dist stage with the bundle the APK
          # was built from. VITE_APP_VERSION was already stamped into it by
          # scripts/apk.sh from the same `git describe` computed above, so the
          # VERSION build arg below still agrees with what the bundle reports.
          build-contexts: |
            frontend-dist=frontend/dist
          # The OCI labels metadata-action produces live on the image manifest,
          # which the running container cannot read. Pass the same facts in as
          # build args so they can be compiled into the binary and surfaced in
          # the app's About dialog.
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            LICENSES=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.licenses'] }}
            SOURCE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.source'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Attaches the very same APK to the GitHub release. It is the artifact the apk
  # job produced, checksum-verified again here, so what someone downloads from
  # the releases page is byte-identical to what the image serves.
  release:
    name: Attach APK to release
    needs: [apk, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.apk.outputs.artifact }}
          path: apk

      - name: Verify the APK is the one that was built
        run: |
          actual="$(sha256sum apk/*.apk | cut -d' ' -f1)"
          expected="${{ needs.apk.outputs.sha256 }}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK checksum mismatch: got $actual, expected $expected"
            exit 1
          fi

      # Only attaches to a release that already exists. Creating one here would
      # publish a release as a side effect of pushing a tag, which is a decision
      # that belongs to whoever is cutting it.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" apk/*.apk --clobber --repo "$REPO"
          else
            echo "::notice::No release exists for $TAG; the APK is available as a workflow artifact."
          fi
