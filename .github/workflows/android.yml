name: Android

# Builds the APK and publishes it as a workflow artifact.
#
# This workflow does not exist to hand out APKs on its own: the server image
# bundles the APK, and docker.yml consumes this artifact to build it. The two are
# split so the APK is built exactly once per commit — the image and the GitHub
# release then carry the same bytes by construction rather than by coincidence,
# and both verify that with the checksum this job publishes.

# No push or pull_request trigger, deliberately. docker.yml calls this workflow,
# and a workflow that is both called *and* independently triggered runs twice on
# every commit — two identical jobs, two identical status checks ("Android /
# Build APK" and "Docker / apk / Build APK"), one of them pure waste. docker.yml
# is the entry point; this is the step it delegates to.
on:
  # Kept, so an APK can still be built on its own from the Actions tab without
  # rebuilding and pushing an image to get one.
  workflow_dispatch:
  # Called by docker.yml, which needs the APK before it can build the image.
  workflow_call:
    outputs:
      artifact:
        description: Name of the artifact holding the APK and its apk.json
        value: ${{ jobs.apk.outputs.artifact }}
      web-artifact:
        description: Name of the artifact holding the built web bundle
        value: ${{ jobs.apk.outputs.web-artifact }}
      version:
        description: Version name compiled into the APK
        value: ${{ jobs.apk.outputs.version }}
      sha256:
        description: Checksum of the APK, for verifying what consumers received
        value: ${{ jobs.apk.outputs.sha256 }}

permissions:
  contents: read
  # The toolchain job publishes the build image to the repository's package
  # registry the first time a given Dockerfile.android is seen.
  packages: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The toolchain the APK is built with, as a container image — the very same
  # Dockerfile.android that scripts/build-apk.sh uses locally.
  #
  # This is what makes "the tools are identical" true by construction. The
  # alternative was two lists of pinned versions, one here and one in the
  # Dockerfile, kept in sync by hand; they had already drifted (Node, pnpm, the
  # JDK patch and the command-line tools all floated here while being pinned
  # there) without anything failing to say so.
  #
  # Tagged by a hash of the Dockerfile, so the image and the recipe cannot
  # disagree: a change to the toolchain produces a new tag, which does not exist
  # yet, which is built and pushed. Every other commit finds its tag already
  # published and does nothing — a few seconds, against the two to three minutes
  # the old setup steps spent installing an SDK on every run.
  toolchain:
    name: Toolchain image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the image tag
        id: tag
        run: |
          # Lowercased: image references must be, and repository names need not.
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          hash="$(sha256sum Dockerfile.android | cut -c1-12)"
          echo "image=ghcr.io/${repo}-android:${hash}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Built only when the tag is missing. `docker manifest inspect` asks the
      # registry directly rather than trusting a cache, so a deleted package is
      # noticed and rebuilt instead of failing the run that follows.
      - name: Build and push the toolchain, if it is not published yet
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Toolchain $IMAGE is already published."
            exit 0
          fi
          echo "Toolchain $IMAGE is new; building it."
          docker buildx build --push -t "$IMAGE" -f Dockerfile.android .

  apk:
    name: Build APK
    needs: toolchain
    runs-on: ubuntu-latest
    # Every step below runs inside the toolchain image, so there is nothing left
    # to install and nothing left to drift.
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # Lifted to the job so the signing step can test it: the `secrets` context
      # is not available in a step-level `if`, but `env` is.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    outputs:
      artifact: activity-lens-apk
      web-artifact: activity-lens-web
      version: ${{ steps.built.outputs.version }}
      sha256: ${{ steps.built.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          # scripts/apk.sh derives the version name from `git describe` and the
          # version code from the commit count; both need full history.
          fetch-depth: 0

      # Both fall back silently — to 0.0.0-dev and to 1 — if git refuses to read
      # the tree, which would stamp a wrong version into a real APK rather than
      # failing. Ownership inside a container job is not always what git expects,
      # so the claim is checked here instead of discovered on a phone.
      - name: Let git read the checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git describe --tags --always >/dev/null

      # The SDK and the JDK are in the image; this is the part that genuinely
      # varies per commit. GRADLE_USER_HOME is where Dockerfile.android puts it.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: /home/builder/.gradle
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # A release build is only signed when the keystore secrets are configured,
      # so a fork — which has none — still gets a working unsigned APK instead of
      # a failed workflow.
      - name: Decode signing keystore
        id: keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "path=$RUNNER_TEMP/release.p12" >> "$GITHUB_OUTPUT"

      # Always a release build, tagged or not.
      #
      # A debug APK is a different application to Android — since the debug build
      # type carries an application id suffix, it installs alongside rather than
      # updating, and Play Protect blocks it on install besides. Building one here
      # meant every untagged commit produced an APK that could not update the app
      # a user already had, which is the opposite of what a build from main is
      # for. There is no reason to want that: signing is identical either way, so
      # the only thing the debug build changed was making the artifact unusable.
      #
      # Without the keystore secrets — a fork, or a PR from one — this produces an
      # unsigned APK. That still proves the build works, which is all CI needs
      # there, but it cannot be installed; only a signed build can.
      - name: Build
        env:
          AL_KEYSTORE: ${{ steps.keystore.outputs.path }}
          AL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/apk.sh release

      # Published as job outputs so every consumer can prove it received these
      # exact bytes rather than trusting that it did.
      - name: Record what was built
        id: built
        run: |
          jq -r '"version=\(.version)"'  mobile/dist/apk.json >> "$GITHUB_OUTPUT"
          jq -r '"sha256=\(.sha256)"'    mobile/dist/apk.json >> "$GITHUB_OUTPUT"
          jq -r '"file=\(.file)"'        mobile/dist/apk.json >> "$GITHUB_OUTPUT"
          echo "Built $(jq -r .file mobile/dist/apk.json)"
          echo "sha256 $(jq -r .sha256 mobile/dist/apk.json)"

      # apk.json travels with the APK: it is what the server reads to report the
      # bundled version, and what consumers check the download against.
      - uses: actions/upload-artifact@v7
        with:
          name: activity-lens-apk
          path: |
            mobile/dist/*.apk
            mobile/dist/apk.json
          if-no-files-found: error
          retention-days: 30

      # The web bundle the APK ships, handed to docker.yml so the server image
      # serves the identical files rather than a second build of the same source.
      # Stage 2 of the Dockerfile used to rebuild this on a different, unpinned
      # Node and pnpm — so the PWA and the native app were built by different
      # toolchains while a comment claimed they shipped the same bundle.
      - uses: actions/upload-artifact@v7
        with:
          name: activity-lens-web
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
