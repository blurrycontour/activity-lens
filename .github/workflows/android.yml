name: Android

# Builds the APK and publishes it as a workflow artifact.
#
# This workflow does not exist to hand out APKs on its own: the server image
# bundles the APK, and docker.yml consumes this artifact to build it. The two are
# split so the APK is built exactly once per commit — the image and the GitHub
# release then carry the same bytes by construction rather than by coincidence,
# and both verify that with the checksum this job publishes.

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:
  workflow_dispatch:
  # Called by docker.yml, which needs the APK before it can build the image.
  workflow_call:
    outputs:
      artifact:
        description: Name of the artifact holding the APK and its apk.json
        value: ${{ jobs.apk.outputs.artifact }}
      version:
        description: Version name compiled into the APK
        value: ${{ jobs.apk.outputs.version }}
      sha256:
        description: Checksum of the APK, for verifying what consumers received
        value: ${{ jobs.apk.outputs.sha256 }}

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      # Lifted to the job so the signing step can test it: the `secrets` context
      # is not available in a step-level `if`, but `env` is.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    outputs:
      artifact: activity-lens-apk
      version: ${{ steps.built.outputs.version }}
      sha256: ${{ steps.built.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/apk.sh derives the version name from `git describe` and the
          # version code from the commit count; both need full history.
          fetch-depth: 0

      # The toolchain is pinned to the same versions as Dockerfile.android, which
      # is what makes a local build and this one produce the same APK. Change one
      # and change the other.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Installed explicitly rather than relying on whatever the runner image
      # happens to ship. build-tools must match what the Android Gradle Plugin
      # in mobile/android/build.gradle asks for.
      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      # A release build is only signed when the keystore secrets are configured,
      # so a fork — which has none — still gets a working unsigned APK instead of
      # a failed workflow.
      - name: Decode signing keystore
        id: keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "path=$RUNNER_TEMP/release.p12" >> "$GITHUB_OUTPUT"

      # Tagged commits are releases and get a signed release build; everything
      # else gets a debug APK, which installs on a phone without any signing
      # material at all.
      #
      # Worth knowing: a debug APK and a release APK are signed with different
      # keys, so Android will not update one to the other. An image built from
      # main bundles a debug APK and can only ever update to other main builds.
      - name: Build
        env:
          AL_KEYSTORE: ${{ steps.keystore.outputs.path }}
          AL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            scripts/apk.sh release
          else
            scripts/apk.sh debug
          fi

      # Published as job outputs so every consumer can prove it received these
      # exact bytes rather than trusting that it did.
      - name: Record what was built
        id: built
        run: |
          jq -r '"version=\(.version)"'  mobile/dist/apk.json >> "$GITHUB_OUTPUT"
          jq -r '"sha256=\(.sha256)"'    mobile/dist/apk.json >> "$GITHUB_OUTPUT"
          jq -r '"file=\(.file)"'        mobile/dist/apk.json >> "$GITHUB_OUTPUT"
          echo "Built $(jq -r .file mobile/dist/apk.json)"
          echo "sha256 $(jq -r .sha256 mobile/dist/apk.json)"

      # apk.json travels with the APK: it is what the server reads to report the
      # bundled version, and what consumers check the download against.
      - uses: actions/upload-artifact@v4
        with:
          name: activity-lens-apk
          path: |
            mobile/dist/*.apk
            mobile/dist/apk.json
          if-no-files-found: error
          retention-days: 30
