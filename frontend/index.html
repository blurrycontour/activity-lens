<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the Android app draws edge to edge, behind the status
         and navigation bars, so the page background is what tints them. It is
         also what makes env(safe-area-inset-*) report real values instead of 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Activity Lens</title>
    <meta name="description" content="A modern workout tracker for runs, rides, hikes and more." />
    <!-- The manifest link is injected by vite-plugin-pwa, which owns the
         manifest contents (see the VitePWA block in vite.config.ts). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- iOS composites a transparent touch icon onto black, so this one — and
         only this one — carries the dark tile baked in. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Matches the app's dark background so the phone status bar blends in
         rather than showing the accent colour. -->
    <meta name="theme-color" content="#0a0b0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
